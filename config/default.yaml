llm:
  provider: gemini
  model: gemini-2.5-flash # 稳定可用；gemini-3.5-flash 当前常 503，可用 -m 临时切
  api_key: ${GEMINI_API_KEY} # 在终端 export GEMINI_API_KEY=你的key
  base_url: # 留空：自动用 Gemini 的 OpenAI 兼容端点（见 llm/router.py）
  max_tokens: 8192
  # temperature: 0   # 留空=不传，用 provider 默认；消融实验设 0 压采样噪声、保证可复现

agent:
  max_steps: 40
  budget_tokens: 80000
  log_dir: ./logs

tools:
  shell:
    timeout: 30 # 秒
    max_output_tokens: 8000 # 截断长度
  file:
    max_view_lines: 100 # view 命令每次显示行数

context:
  repo_map_budget: 8000 # repo-map 最大 token 数
  history_window: 20 # 保留最近 N 轮对话
